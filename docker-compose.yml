services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - mongodb
    environment:
      DB_DSN: "mysql:host=db;port=3306;dbname=zooarcadia"
      DB_USER: "user"
      DB_PASSWORD: "password"
      MONGODB_URI: "mongodb://mongodb:27017"
      MONGODB_DATABASE: "ECFArcadia"

  db:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: zooarcadia
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql
    ports:
      - "3306:3306"

  mongodb:
    image: mongo:5.0
    container_name: mongodb
    volumes:
      - ./mongo_data:/data/db
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"
    command: bash -c "sleep 10 && mongod --bind_ip_all"

volumes:
  db_data:
  mongo_data:
